name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Probar y compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Preparar firma Android
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mudanzas.keystore"

      - name: Validar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          test "$APP_VERSION" = "$TAG_VERSION" || {
            echo "La etiqueta v$TAG_VERSION no coincide con pubspec $APP_VERSION"
            exit 1
          }

      - name: Compilar APK ARM64
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mudanzas.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Preparar archivo descargable
        shell: bash
        run: |
          APP_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/mudanzas-v${APP_VERSION}-arm64.apk"
          echo "APK_PATH=dist/mudanzas-v${APP_VERSION}-arm64.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Guardar APK del proceso
        uses: actions/upload-artifact@v7
        with:
          name: mudanzas-android-v${{ env.APP_VERSION }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
